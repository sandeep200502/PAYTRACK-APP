spring.application.name=paytrack-api
server.port=4000

# File-based H2 database so data survives restarts, same spirit as the
# original server/db.json file. The .mv.db file is created under ./data.
spring.datasource.url=jdbc:h2:file:./data/paytrackdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=false

# Handy for the demo / grading: browse the data at http://localhost:4000/h2-console
# JDBC URL to paste in: jdbc:h2:file:./data/paytrackdb
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jackson.serialization.indent-output=false

# Login tokens (JWT). CHANGE the secret before real use; keep it out of source control.
paytrack.jwt.secret=paytrack-dev-secret-change-me-at-least-32-characters
paytrack.jwt.hours=24

# The account that registers with this email becomes the administrator.
paytrack.admin.email=admin@paytrack.in
paytrack.admin.password=Admin@123
