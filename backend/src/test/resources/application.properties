# Tests use a throw-away in-memory database so they never touch ./data/paytrackdb
spring.datasource.url=jdbc:h2:mem:paytracktest;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false

paytrack.jwt.secret=test-secret-test-secret-test-secret-123456
paytrack.jwt.hours=1
paytrack.admin.email=admin@paytrack.test
paytrack.admin.password=secret123
